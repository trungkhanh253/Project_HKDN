version: '3.8'

services:
  postgres:
    image: ankane/pgvector:v0.5.0
    container_name: hkdn_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kiet2201}
      POSTGRES_DB: ${POSTGRES_DB:-attendance_server}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:alpine
    container_name: hkdn_redis
    ports:
      - "6379:6379"
    restart: always

  api:
    build: ./server
    container_name: hkdn_api
    command: gunicorn -w 4 -k gevent "app:create_app()" --bind 0.0.0.0:5000
    volumes:
      - ./server:/app
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-kiet2201}@postgres:5432/attendance_server
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - postgres
      - redis
    restart: always

  worker:
    build: ./server
    container_name: hkdn_worker
    command: python worker.py
    volumes:
      - ./server:/app
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-kiet2201}@postgres:5432/attendance_server
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - postgres
      - redis
    restart: always

volumes:
  pgdata: