services:
  postgres:
    image: ankane/pgvector:v0.5.0
    container_name: hkdn_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kiet2201}
      POSTGRES_DB: ${POSTGRES_DB:-attendance_server}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-attendance_server}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:alpine
    container_name: hkdn_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  api:
    build: ./server
    container_name: hkdn_api
    command: gunicorn -w 4 -k gevent --reload "app:create_app()" --bind 0.0.0.0:5000
    volumes:
      - ./server:/app
      - ./docs:/docs:ro
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-kiet2201}@postgres:5432/${POSTGRES_DB:-attendance_server}}
      - TEST_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-kiet2201}@postgres:5432/attendance_test
      - TEST_BASE_URL=http://localhost:5000
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:-hkdn-default-secret-key-2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  worker:
    build: ./server
    container_name: hkdn_worker
    command: python worker.py
    volumes:
      - ./server:/app
      - ./docs:/docs:ro
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-kiet2201}@postgres:5432/${POSTGRES_DB:-attendance_server}}
      - TEST_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-kiet2201}@postgres:5432/attendance_test
      - TEST_BASE_URL=http://localhost:5000
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:-hkdn-default-secret-key-2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

volumes:
  pgdata: