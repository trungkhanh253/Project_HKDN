apply plugin: 'com.android.application'

// Đọc local.properties để lấy Brevo SMTP config an toàn
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}

android {
    signingConfigs {
        ubioxiris {
            storeFile file('./keystore/debug.keystore_ubioxPro')
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storePassword 'android'
        }
    }

    compileSdkVersion 29
    defaultConfig {
        applicationId "com.iritech.android.irissample"
        minSdkVersion 19
        targetSdkVersion 29
        versionCode 2020126
        versionName "2.0.20126"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk{
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        signingConfig signingConfigs.ubioxiris

        // Đọc dữ liệu bảo mật từ file local.properties thay vì gán cứng
        buildConfigField "String", "BREVO_SMTP_LOGIN", "\"${localProperties.getProperty('BREVO_SMTP_LOGIN', '')}\""
        buildConfigField "String", "BREVO_SMTP_KEY", "\"${localProperties.getProperty('BREVO_SMTP_KEY', '')}\""
        buildConfigField "String", "BREVO_SENDER_EMAIL", "\"${localProperties.getProperty('BREVO_SENDER_EMAIL', '')}\""
        buildConfigField "String", "BREVO_SENDER_NAME", "\"${localProperties.getProperty('BREVO_SENDER_NAME', 'Iris Sample System')}\""

        externalNativeBuild {
            cmake {
                cppFlags "-frtti -fexceptions"
            }
        }
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
            ndkVersion "16.1.4479499"
        }
    }
     buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.ubioxiris
        }
        debug{
            signingConfig signingConfigs.ubioxiris
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        doNotStrip "**/libmqel_irisreg704.so"
        doNotStrip "**/libmqel_irisreg704s.so"
        exclude 'META-INF/NOTICE.md'
        exclude 'META-INF/LICENSE.md'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/DEPENDENCIES'
    }

    ndkVersion "16.1.4479499"
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation 'androidx.appcompat:appcompat:1.0.2'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.1'
    implementation 'com.google.android.material:material:1.0.0'

    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.code.gson:gson:2.2.4'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'

    // InstanceID
    implementation 'com.google.android.gms:play-services-gcm:17.0.0'
    implementation 'com.googlecode.json-simple:json-simple:1.1'

    // Thư viện vẽ biểu đồ MPAndroidChart
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // JavaMail API cho gửi email SMTP
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'

    // AndroidX Biometric - Device Lock
    implementation 'androidx.biometric:biometric:1.1.0'

    implementation 'com.google.mlkit:face-detection:16.0.5'
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'

    // AndroidX WorkManager (ban 2.5.0 tuong thich voi compileSdkVersion 29)
    implementation 'androidx.work:work-runtime:2.5.0'

    // Retrofit 2 & OkHttp (cho giao tiep mang va dong bo)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.3'
}