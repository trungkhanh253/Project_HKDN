  /sync/pull:
    get:
      tags: [Synchronization]
      summary: Kéo danh sách các bản ghi thay đổi từ Server có `seq > after_seq`
      description: |
        - Trả về tất cả các bản ghi có `seq > after_seq` trên cả 6 bảng, sắp xếp theo `seq` tăng dần.
        - Giới hạn mặc định mỗi lần là `limit = 100` (tối đa `500` bản ghi/lần).
        - Nếu còn dữ liệu phía sau, `has_more` sẽ là `true`; Client tiếp tục gọi `/sync/pull?after_seq=<next_seq>` cho đến khi `has_more = false`.
        - **Lưu ý:** Kết quả trả về **bao gồm cả các bản ghi đã xóa mềm** (`deleted_at != null`) để Client đồng bộ trạng thái xóa.
      parameters:
        - name: after_seq
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
          description: "Số sequence lớn nhất mà Client đã đồng bộ ở lần trước (mặc định 0)"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
          description: "Số lượng bản ghi tối đa trả về trong 1 lần pull (mặc định 100, tối đa 500)"
      responses:
        '200':
          description: Danh sách thay đổi kèm thông tin phân trang sequence
          content:
            application/json:
              example:
                after_seq: 10
                next_seq: 15
                latest_seq: 15
                limit: 100
                has_more: false
                changes:
                  admin: []
                  subjects:
                    - subject_id: "IT001"
                      subject_name: "Trí tuệ Nhân tạo"
                      time_slot: "Thứ 3 (09:30 - 11:30)"
