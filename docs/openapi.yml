openapi: 3.0.3
info:
  title: API Hệ thống Điểm danh Sinh trắc học (Project_HKDN)
  version: 1.1.0
  description: |
    Tài liệu đặc tả RESTful API cho hệ thống Điểm danh Sinh trắc học Khuôn mặt (Project_HKDN).

    ### Quy ước chung
    1. **Tiền tố đường dẫn (Base Path):** Tất cả endpoint hỗ trợ tiền tố `/api/v1` (khuyến nghị) và tương thích ngược ở gốc `/`.
    2. **Xác thực (Authentication):**
       - Đăng nhập qua `POST /api/v1/auth/login` bằng `email` và `password` để nhận `access_token` và `refresh_token`.
       - Gửi kèm header `Authorization: Bearer <access_token>` cho các request cần xác thực.
       - Tạo sẵn tài khoản Admin mẫu để test bằng lệnh:
         `docker compose exec api python seed_admin.py` (Tài khoản: `admin@hkdn.edu.vn` / `admin123` hoặc `lecturer@hkdn.edu.vn` / `lecturer123`).
    3. **Cơ chế Đồng bộ 2 chiều (`/sync/push` & `/sync/pull`):**
       - **6 bảng chuẩn:** `admin`, `subjects`, `students`, `enrollments`, `checkin_history`, `email_recipients`.
       - **Nhận diện bản ghi (Identity):** Tất cả 6 bảng đều có cột `uuid` (`UNIQUE NOT NULL`). Khi `push`, Server ưu tiên khớp theo `uuid`, nếu chưa có sẽ khớp theo khóa tự nhiên của từng bảng:
         - `admin`: `uuid` hoặc `admin_id` / `email`
         - `subjects`: `uuid` hoặc `subject_id`
         - `students`: `uuid` hoặc `student_id`
         - `enrollments`: `uuid` hoặc cặp khóa chính `(student_id, subject_id)`
         - `checkin_history`: `uuid` (hoặc `checkin_id`)
         - `email_recipients`: `uuid` hoặc cặp duy nhất `(subject_id, email_address)`
       - **Ai gán `seq`:** Do **PostgreSQL trên Server** tự động gán qua 1 Sequence chung toàn cục (`global_sync_seq`) và Trigger `BEFORE INSERT OR UPDATE` (`bump_sync_metadata`). Khi thêm mới (`INSERT`), sửa (`UPDATE`) hoặc xóa mềm (`deleted_at != null`), `seq` luôn tự động tăng. Client không cần tự gán `seq`.
       - **Giải quyết xung đột (Conflict Resolution):** Theo chiến lược **Last-Write-Wins (LWW)** dựa vào `updated_at`. Nếu bản ghi client đẩy lên có `updated_at < existing.updated_at` trên Server thì bản ghi đó được giữ nguyên trên Server và tính vào `skipped`. Push lặp lại cùng dữ liệu (Idempotent) sẽ cập nhật tại chỗ (Upsert), **không tạo bản ghi trùng**.
       - **Xóa mềm (Soft Delete):** Bản ghi xóa mềm có `deleted_at` khác `null` (ISO-8601 timestamp). `/sync/pull` **có trả về** các bản ghi đã xóa mềm (`deleted_at != null`) để Client cập nhật trạng thái xóa dưới SQLite local.
    4. **Định dạng lỗi thống nhất:**
       Mọi phản hồi lỗi (`400`, `401`, `404`, `409`, `422`, `500`) đều trả về `application/json` theo cấu trúc:
       ```json
       {
         "error": {
           "code": "MÃ_LỖI",
           "message": "Mô tả chi tiết lỗi"
         }
       }
       ```

    ### Phần bổ sung cho nhóm Web (v1.1.0)
    - Endpoint có `x-status: implemented` đã chạy trên server. Endpoint có `x-status: planned` là **hợp đồng đã chốt**, server đang làm; nhóm Web có thể viết code gọi theo đúng đặc tả này.
    - **Backend trước:** nhóm Web gọi API thật. Nếu cần mock tạm thì mock phải trả đúng cấu trúc trong file này, sau đó chỉ đổi base URL.
    - **Danh sách phân trang:** mọi `GET` danh sách trả `{ "items": [...], "total": n, "limit": n, "offset": n }`. Tham số chung: `limit` (mặc định 50, tối đa 500), `offset`, `q` (tìm kiếm), `sort` (tên trường, thêm dấu `-` phía trước để giảm dần, ví dụ `-updated_at`).
    - **Xóa:** mọi `DELETE` là xóa mềm (`deleted_at`), trả `204`. Bản ghi bị xóa không xuất hiện trong danh sách; app Android nhận được thay đổi qua `/sync/pull`.
    - **Phân quyền:** `SUPER_ADMIN` thấy và sửa toàn bộ. `ADMIN` (giảng viên) chỉ thao tác trên môn có `instructor_id` là mình và sinh viên, ghi danh, điểm danh, email của các môn đó. Truy cập ngoài phạm vi trả `403 FORBIDDEN`.
    - **Dữ liệu nhạy cảm:** API dành cho Web **không bao giờ** trả `password`, `reset_token`, `expire_at`, `checkin_password`, `face_embedding`. Các trường này chỉ nằm trong `/sync/*` dành cho app Android.
    - **CORS:** server cho phép origin của web theo cấu hình `CORS_ORIGINS`.
    - **Mật khẩu:** web gửi mật khẩu thường qua HTTPS, server tự băm SHA-256 như hiện tại.
    - **Thời gian:** `date-time` theo ISO-8601 (UTC). `checkin_date` dạng `YYYY-MM-DD`, `checkin_time` dạng `HH:MM:SS`.
servers:
- url: http://localhost:5000/api/v1
  description: Local Development Server (v1)
- url: http://localhost:5000
  description: Root Alias (tương thích ngược cho /health)
- url: http://192.168.1.250:5000/api/v1
  description: Máy chủ test dùng chung trong mạng LAN (IP có thể đổi, Nhóm 1 sẽ báo khi đổi)
tags:
- name: System
- name: Authentication
  description: Đăng nhập, làm mới token, quên và đổi mật khẩu.
- name: Students
  description: Quản lý sinh viên (xóa mềm).
- name: Subjects
  description: Môn học, ghi danh sinh viên vào môn.
- name: Attendance
  description: Điểm danh và thống kê.
- name: Admins
  description: Tài khoản quản trị viên / giảng viên.
- name: Email Reports
  description: Danh sách người nhận và gửi báo cáo điểm danh (ưu tiên thấp).
- name: CSV Import & Background Jobs
- name: Synchronization
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Nhập JWT token theo cú pháp: `Bearer <token>`'
  schemas:
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Dữ liệu đầu vào không hợp lệ.
            details:
              type: object
              nullable: true
    AdminRecord:
      type: object
      required:
      - admin_id
      - email
      - full_name
      properties:
        admin_id:
          type: string
          example: ADM_001
        email:
          type: string
          format: email
          example: lecturer@hkdn.edu.vn
        password:
          type: string
          description: Mật khẩu dạng plain-text hoặc SHA-256 hex (chỉ gửi khi tạo/đổi mật khẩu)
          example: lecturer123
        full_name:
          type: string
          example: Nguyễn Văn Giảng
        date_of_birth:
          type: string
          nullable: true
          example: '1985-05-15'
        phone:
          type: string
          nullable: true
          example: 0909876543
        gender:
          type: string
          nullable: true
          example: Nam
        photo_path:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        role:
          type: string
          enum:
          - SUPER_ADMIN
          - ADMIN
          default: ADMIN
        admin_code:
          type: string
          nullable: true
          example: GV001
        is_first_login:
          type: integer
          default: 1
        has_iris:
          type: integer
          default: 0
        face_embedding:
          type: array
          nullable: true
          items:
            type: number
            format: float
          minItems: 192
          maxItems: 192
          description: Vector đặc trưng khuôn mặt đúng 192 chiều (MobileFaceNet)
        uuid:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-000000000002
        updated_at:
          type: string
          format: date-time
          example: '2026-11-09T10:00:00Z'
        deleted_at:
          type: string
          format: date-time
          nullable: true
          example: null
        seq:
          type: integer
          readOnly: true
          example: 1
    SubjectRecord:
      type: object
      required:
      - subject_id
      - subject_name
      properties:
        subject_id: &id005
          type: string
          example: IT001
        subject_name: &id006
          type: string
          example: Nhập môn Lập trình
        time_slot: &id007
          type: string
          nullable: true
          example: Thứ 2 (07:30 - 09:30)
        created_by:
          type: string
          nullable: true
          description: FK trỏ tới admin.admin_id
          example: SADM_001
        instructor_id: &id008
          type: string
          nullable: true
          description: Giảng viên phụ trách (FK admin.admin_id). ADMIN tạo môn thì server tự gán là chính
            họ.
          example: ADM_001
        subject_status: &id009
          type: string
          default: ASSIGNED
          example: ASSIGNED
        created_at:
          type: string
          nullable: true
          example: '2026-09-01T08:00:00'
        semester_start_date: &id010
          type: string
          nullable: true
          example: 01/09/2026
        semester_end_date: &id011
          type: string
          nullable: true
          example: 30/11/2026
        uuid:
          type: string
          format: uuid
          example: 11111111-2222-4333-8444-555555555555
        updated_at:
          type: string
          format: date-time
          example: '2026-11-09T10:05:00Z'
        deleted_at:
          type: string
          format: date-time
          nullable: true
          example: null
        seq:
          type: integer
          readOnly: true
          example: 2
    StudentRecord:
      type: object
      required:
      - student_id
      properties:
        student_id:
          type: string
          example: SV2026001
        full_name:
          type: string
          nullable: true
          example: Trần Thị B
        email:
          type: string
          nullable: true
          example: sv001@student.edu.vn
        phone:
          type: string
          nullable: true
          example: 0912345678
        photo_path:
          type: string
          nullable: true
        checkin_password:
          type: string
          nullable: true
          example: '1234'
        face_embedding:
          type: array
          nullable: true
          items:
            type: number
            format: float
          minItems: 192
          maxItems: 192
        uuid:
          type: string
          format: uuid
          example: 22222222-3333-4444-8555-666666666666
        updated_at:
          type: string
          format: date-time
          example: '2026-11-09T10:10:00Z'
        deleted_at:
          type: string
          format: date-time
          nullable: true
          example: null
        seq:
          type: integer
          readOnly: true
          example: 3
    EnrollmentRecord:
      type: object
      required:
      - student_id
      - subject_id
      properties:
        student_id:
          type: string
          example: SV2026001
        subject_id:
          type: string
          example: IT001
        enrollment_status:
          type: string
          nullable: true
          example: Enrolled
        uuid:
          type: string
          format: uuid
          example: 33333333-4444-4555-8666-777777777777
        updated_at:
          type: string
          format: date-time
          example: '2026-11-09T10:15:00Z'
        deleted_at:
          type: string
          format: date-time
          nullable: true
          example: null
        seq:
          type: integer
          readOnly: true
          example: 4
    CheckinHistoryRecord:
      type: object
      required:
      - student_id
      - subject_id
      properties:
        checkin_id:
          type: integer
          example: 1
        student_id:
          type: string
          example: SV2026001
        subject_id:
          type: string
          example: IT001
        checkin_time:
          type: string
          example: 07:35:12
        checkin_date:
          type: string
          example: '2026-11-09'
        uuid:
          type: string
          format: uuid
          example: 44444444-5555-4666-8777-888888888888
        updated_at:
          type: string
          format: date-time
          example: '2026-11-09T10:20:00Z'
        deleted_at:
          type: string
          format: date-time
          nullable: true
          example: null
        seq:
          type: integer
          readOnly: true
          example: 5
    EmailRecipientRecord:
      type: object
      required:
      - subject_id
      - email_address
      properties:
        email_id:
          type: integer
          example: 1
        subject_id:
          type: string
          example: IT001
        email_address:
          type: string
          format: email
          example: academic_affairs@hkdn.edu.vn
        recipient_name:
          type: string
          nullable: true
          example: Phòng Đào Tạo
        added_date:
          type: string
          nullable: true
          example: '2026-11-01'
        is_selected:
          type: boolean
          default: true
        uuid:
          type: string
          format: uuid
          example: 55555555-6666-4777-8888-999999999999
        updated_at:
          type: string
          format: date-time
          example: '2026-11-09T10:25:00Z'
        deleted_at:
          type: string
          format: date-time
          nullable: true
          example: null
        seq:
          type: integer
          readOnly: true
          example: 6
    AdminPublic:
      type: object
      required:
      - admin_id
      - email
      - full_name
      properties:
        admin_id:
          type: string
          example: ADM_001
        email:
          type: string
          format: email
          example: lecturer@hkdn.edu.vn
        full_name:
          type: string
          example: Nguyễn Văn Giảng
        date_of_birth:
          type: string
          nullable: true
          example: '1985-05-15'
        phone:
          type: string
          nullable: true
          example: 0909876543
        gender:
          type: string
          nullable: true
          example: Nam
        photo_path:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        role:
          type: string
          enum:
          - SUPER_ADMIN
          - ADMIN
          default: ADMIN
        admin_code:
          type: string
          nullable: true
          example: GV001
        is_first_login:
          type: integer
          default: 1
        has_iris:
          type: integer
          default: 0
        uuid:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-000000000002
        updated_at:
          type: string
          format: date-time
          example: '2026-11-09T10:00:00Z'
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
          example: null
        seq:
          type: integer
          readOnly: true
          example: 1
      description: Thông tin tài khoản dành cho Web (không có mật khẩu, token, vector khuôn mặt).
    StudentPublic:
      type: object
      required:
      - student_id
      properties:
        student_id:
          type: string
          example: SV2026001
        full_name:
          type: string
          nullable: true
          example: Trần Thị B
        email:
          type: string
          nullable: true
          example: sv001@student.edu.vn
        phone:
          type: string
          nullable: true
          example: 0912345678
        photo_path:
          type: string
          nullable: true
        uuid:
          type: string
          format: uuid
          example: 22222222-3333-4444-8555-666666666666
        updated_at:
          type: string
          format: date-time
          example: '2026-11-09T10:10:00Z'
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
          example: null
        seq:
          type: integer
          readOnly: true
          example: 3
      description: Thông tin sinh viên dành cho Web (không có mật khẩu điểm danh, vector khuôn mặt).
    StudentList:
      type: object
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StudentPublic'
        total:
          type: integer
          description: Tổng số bản ghi khớp bộ lọc (chưa phân trang)
          example: 125
        limit:
          type: integer
          example: 50
        offset:
          type: integer
          example: 0
    SubjectList:
      type: object
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubjectRecord'
        total:
          type: integer
          description: Tổng số bản ghi khớp bộ lọc (chưa phân trang)
          example: 125
        limit:
          type: integer
          example: 50
        offset:
          type: integer
          example: 0
    AdminList:
      type: object
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminPublic'
        total:
          type: integer
          description: Tổng số bản ghi khớp bộ lọc (chưa phân trang)
          example: 125
        limit:
          type: integer
          example: 50
        offset:
          type: integer
          example: 0
    StudentCreate:
      type: object
      required:
      - student_id
      - full_name
      properties:
        student_id:
          type: string
          example: SV2026001
        full_name: &id001
          type: string
          example: Trần Thị B
        email: &id002
          type: string
          nullable: true
          example: sv001@student.edu.vn
        phone: &id003
          type: string
          nullable: true
          example: 0912345678
        checkin_password: &id004
          type: string
          nullable: true
          description: Mật khẩu điểm danh dự phòng (chỉ gửi lên, không bao giờ trả về)
        subject_id:
          type: string
          nullable: true
          description: Nếu có, tự ghi danh sinh viên vào môn này
          example: IT001
    StudentUpdate:
      type: object
      description: Chỉ cập nhật các trường được gửi.
      properties:
        full_name: *id001
        email: *id002
        phone: *id003
        checkin_password: *id004
    SubjectInput:
      type: object
      required:
      - subject_id
      - subject_name
      properties:
        subject_id: *id005
        subject_name: *id006
        time_slot: *id007
        instructor_id: *id008
        subject_status: *id009
        semester_start_date: *id010
        semester_end_date: *id011
    SubjectUpdate:
      type: object
      description: Chỉ cập nhật các trường được gửi.
      properties:
        subject_name: *id006
        time_slot: *id007
        instructor_id: *id008
        subject_status: *id009
        semester_start_date: *id010
        semester_end_date: *id011
    EnrolledStudent:
      allOf:
      - $ref: '#/components/schemas/StudentPublic'
      - type: object
        properties:
          enrollment_status:
            type: string
            nullable: true
            example: Enrolled
    EnrolledStudentList:
      type: object
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EnrolledStudent'
        total:
          type: integer
          description: Tổng số bản ghi khớp bộ lọc (chưa phân trang)
          example: 125
        limit:
          type: integer
          example: 50
        offset:
          type: integer
          example: 0
    EnrollmentCreate:
      type: object
      required:
      - student_id
      properties:
        student_id:
          type: string
          example: SV2026001
        enrollment_status:
          type: string
          nullable: true
          example: Enrolled
    CheckinWithStudent:
      allOf:
      - $ref: '#/components/schemas/CheckinHistoryRecord'
      - type: object
        properties:
          student_name:
            type: string
            nullable: true
            example: Trần Thị B
    CheckinList:
      type: object
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckinWithStudent'
        total:
          type: integer
          description: Tổng số bản ghi khớp bộ lọc (chưa phân trang)
          example: 125
        limit:
          type: integer
          example: 50
        offset:
          type: integer
          example: 0
    AttendanceCreate:
      type: object
      required:
      - student_id
      - subject_id
      - uuid
      properties:
        student_id:
          type: string
          example: SV2026001
        subject_id:
          type: string
          example: IT001
        checkin_date:
          type: string
          example: '2026-11-14'
          description: Mặc định là ngày hiện tại của server
        checkin_time:
          type: string
          example: 07:35:12
          description: Mặc định là giờ hiện tại của server
        uuid:
          type: string
          format: uuid
          description: Gửi lặp cùng uuid không tạo bản ghi trùng (idempotent)
        device_id:
          type: string
          nullable: true
          example: android-emulator-01
    AttendanceSummary:
      type: object
      properties:
        subject_id:
          type: string
          example: IT001
        total_sessions:
          type: integer
          description: Số buổi = số ngày `checkin_date` khác nhau có ít nhất một lượt điểm danh của môn
            trong khoảng lọc
          example: 12
        items:
          type: array
          items:
            type: object
            properties:
              student_id:
                type: string
                example: SV2026001
              full_name:
                type: string
                nullable: true
                example: Trần Thị B
              present_count:
                type: integer
                example: 10
              absent_count:
                type: integer
                example: 2
              attendance_rate:
                type: number
                format: float
                description: present_count / total_sessions (0 đến 1)
                example: 0.83
    EmailRecipientInput:
      type: object
      required:
      - email_address
      properties:
        email_address:
          type: string
          format: email
          example: academic_affairs@hkdn.edu.vn
        recipient_name:
          type: string
          nullable: true
          example: Phòng Đào Tạo
        is_selected:
          type: boolean
          default: true
    EmailRecipientList:
      type: object
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EmailRecipientRecord'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 500
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
    Q:
      name: q
      in: query
      description: Từ khóa tìm kiếm (không phân biệt hoa thường) trên các trường văn bản chính của bản
        ghi
      schema:
        type: string
    Sort:
      name: sort
      in: query
      description: Tên trường để sắp xếp; thêm `-` phía trước để giảm dần. Ví dụ `full_name`, `-updated_at`
      schema:
        type: string
  responses:
    Unauthorized:
      description: Thiếu hoặc sai token (`MISSING_TOKEN`, `INVALID_TOKEN`, token hết hạn)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_TOKEN
              message: Chữ ký JWT không hợp lệ.
    Forbidden:
      description: Không đủ quyền với tài nguyên này (ví dụ ADMIN truy cập môn của giảng viên khác)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FORBIDDEN
              message: Bạn không có quyền truy cập môn học này.
    NotFound:
      description: Không tìm thấy bản ghi (hoặc đã bị xóa mềm)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: Không tìm thấy sinh viên.
    Conflict:
      description: Xung đột dữ liệu (trùng khóa nghiệp vụ)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: CONFLICT
              message: Mã sinh viên đã tồn tại.
    ValidationError:
      description: Dữ liệu gửi lên không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: Dữ liệu đầu vào không hợp lệ.
paths:
  /health:
    get:
      tags:
      - System
      summary: Kiểm tra trạng thái hoạt động của Server
      responses:
        '200':
          description: Server hoạt động bình thường
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
              example:
                status: healthy
      x-status: implemented
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Đăng nhập tài khoản Admin / Giảng viên để nhận JWT Token
      description: |
        Xác thực bằng `email` (hoặc `username` / `admin_id`) và `password`.
        Mật khẩu lưu trong bảng `admin` được băm bằng `SHA-256` (đồng bộ với `DatabaseHelper.java` trên Android).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - password
              properties:
                email:
                  type: string
                  example: admin@hkdn.edu.vn
                username:
                  type: string
                  description: Tùy chọn thay thế cho email (có thể truyền email, admin_id hoặc admin_code)
                password:
                  type: string
                  example: admin123
            example:
              email: admin@hkdn.edu.vn
              password: admin123
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                token_type: Bearer
                expires_in: 3600
                admin:
                  admin_id: SADM_001
                  uuid: 00000000-0000-4000-8000-000000000001
                  email: admin@hkdn.edu.vn
                  full_name: Quản Trị Viên Hệ Thống (Super Admin)
                  role: SUPER_ADMIN
                  is_first_login: 0
        '401':
          description: Sai thông tin đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: Email hoặc mật khẩu không chính xác.
        '422':
          description: Thiếu trường email hoặc password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-status: implemented
  /auth/refresh:
    post:
      tags:
      - Authentication
      summary: Làm mới Access Token bằng Refresh Token
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Cấp lại access_token mới thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                    example: 3600
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                token_type: Bearer
                expires_in: 3600
        '401':
          description: Thiếu token hoặc token không hợp lệ / đã hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_TOKEN
                  message: Chữ ký JWT không hợp lệ.
      description: 'Gửi refresh token trong header `Authorization: Bearer <refresh_token>` **hoặc** trong
        body `{ "refresh_token": "..." }` (server nhận cả hai). Access token sống 1 giờ, refresh token
        7 ngày.'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      x-status: implemented
  /auth/me:
    get:
      tags:
      - Authentication
      summary: Lấy thông tin tài khoản đang đăng nhập
      description: Dùng khi web tải lại trang để biết token còn hiệu lực và vai trò (`role`) của người
        dùng.
      x-status: implemented
      security: &id012
      - BearerAuth: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  admin:
                    $ref: '#/components/schemas/AdminPublic'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/logout:
    post:
      tags:
      - Authentication
      summary: Đăng xuất và thu hồi refresh token
      description: Body có thể gửi `refresh_token` (nếu web lưu trong body). Nếu web dùng HttpOnly cookie,
        server tự đọc cookie và xóa cookie.
      x-status: planned
      security: *id012
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Đã đăng xuất
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Đăng xuất thành công.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/forgot-password:
    post:
      tags:
      - Authentication
      summary: Yêu cầu mã đặt lại mật khẩu
      description: Gửi mã đặt lại mật khẩu về email. Luôn trả `200` với cùng một thông báo dù email có
        tồn tại hay không, để không lộ danh sách tài khoản. Mã có hiệu lực **120 giây** (cùng quy tắc
        với app Android).
      x-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                  example: lecturer@hkdn.edu.vn
      responses:
        '200':
          description: Đã nhận yêu cầu
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Nếu email tồn tại, mã đặt lại mật khẩu đã được gửi.
                  expires_in:
                    type: integer
                    example: 120
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/reset-password:
    post:
      tags:
      - Authentication
      summary: Đặt lại mật khẩu bằng mã nhận qua email
      x-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - reset_token
              - new_password
              properties:
                email:
                  type: string
                  format: email
                reset_token:
                  type: string
                new_password: &id013
                  type: string
                  minLength: 6
                  example: MatKhauMoi@123
      responses:
        '200':
          description: Đổi mật khẩu thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Đặt lại mật khẩu thành công.
        '400':
          description: Mã sai hoặc đã hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_RESET_TOKEN
                  message: Mã đặt lại mật khẩu không đúng hoặc đã hết hạn.
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/change-password:
    post:
      tags:
      - Authentication
      summary: Đổi mật khẩu khi đã đăng nhập
      description: Dùng cả cho đổi mật khẩu lần đầu. Thành công thì `is_first_login` chuyển về `0`.
      x-status: planned
      security: *id012
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - current_password
              - new_password
              properties:
                current_password:
                  type: string
                new_password: *id013
      responses:
        '200':
          description: Đổi mật khẩu thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Đổi mật khẩu thành công.
        '400':
          description: Mật khẩu hiện tại sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: WRONG_CURRENT_PASSWORD
                  message: Mật khẩu hiện tại không chính xác.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
