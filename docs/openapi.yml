          `admin` -> `subjects` -> `students` -> `enrollments` -> `checkin_history` -> `email_recipients`.
        - **Thêm mới (Insert):** Bản ghi có `uuid` / khóa chính chưa tồn tại trên Server, `deleted_at: null`.
        - **Cập nhật (Update):** Bản ghi đã tồn tại, có `updated_at` mới hơn hoặc bằng bản ghi trên Server, `deleted_at: null`.
        - **Xóa mềm (Soft Delete):** Bản ghi có `deleted_at` là chuỗi thời gian ISO-8601 (khác `null`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                admin:
                  type: array
                  items:
                    $ref: '#/components/schemas/AdminRecord'
                subjects:
                  type: array
                  items:
                    $ref: '#/components/schemas/SubjectRecord'
                students:
                  type: array
                  items:
                    $ref: '#/components/schemas/StudentRecord'
                enrollments:
                  type: array
                  items:
                    $ref: '#/components/schemas/EnrollmentRecord'
                checkin_history:
                  type: array
                  items:
                    $ref: '#/components/schemas/CheckinHistoryRecord'
                email_recipients:
                  type: array
                  items:
                    $ref: '#/components/schemas/EmailRecipientRecord'
            example:
              students:
              - student_id: SV2026001
                full_name: Nguyễn Văn A (Thêm mới)
                email: sv001@student.edu.vn
                phone: 0901112222
                checkin_password: '1111'
                uuid: 22222222-3333-4444-8555-666666666601
                updated_at: '2026-11-09T11:00:00Z'
                deleted_at: null
              - student_id: SV2026002
                full_name: Trần Thị B (Đã sửa tên & SĐT)
                email: sv002@student.edu.vn
                phone: 0903334444
                uuid: 22222222-3333-4444-8555-666666666602
                updated_at: '2026-11-09T11:05:00Z'
                deleted_at: null
              - student_id: SV2026003
                full_name: Lê Văn C (Xóa mềm)
                uuid: 22222222-3333-4444-8555-666666666603
                updated_at: '2026-11-09T11:10:00Z'
                deleted_at: '2026-11-09T11:10:00Z'
              subjects:
              - subject_id: IT001
                subject_name: Trí tuệ Nhân tạo
                time_slot: Thứ 3 (09:30 - 11:30)
                subject_status: UNASSIGNED
                uuid: 11111111-2222-4333-8444-555555555501
                updated_at: '2026-11-09T11:00:00Z'
                deleted_at: null
              enrollments:
              - student_id: SV2026001
                subject_id: IT001
                enrollment_status: Enrolled
                uuid: 33333333-4444-4555-8666-777777777701
                updated_at: '2026-11-09T11:02:00Z'
                deleted_at: null
      responses:
        '200':
          description: Đồng bộ đẩy lên thành công
          content:
            application/json:
              example:
                status: ok
                applied:
                  admin: 0
                  subjects: 1
                  students: 3
                  enrollments: 1
                  checkin_history: 0
                  email_recipients: 0
                skipped:
                  admin: 0
                  subjects: 0
                  students: 0
                  enrollments: 0
                  checkin_history: 0
                  email_recipients: 0
                latest_seq: 15
        '409':
          description: Vi phạm khóa ngoại (ví dụ đẩy enrollments cho student_id hoặc subject_id chưa tồn
            tại) hoặc xung đột Unique
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTEGRITY_CONFLICT
                  message: Vi phạm ràng buộc khóa ngoại (Foreign Key) hoặc tính duy nhất (Unique) khi
                    đồng bộ.
        '422':
          description: Dữ liệu sai định dạng (thiếu trường bắt buộc hoặc face_embedding không đúng 192
            chiều)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Trường face_embedding phải là mảng số thực có đúng 192 chiều.
      x-status: implemented
  /sync/pull:
    get:
      tags:
      - Synchronization
      summary: Kéo danh sách các bản ghi thay đổi từ Server có `seq > after_seq`
      description: |
        - Trả về tất cả các bản ghi có `seq > after_seq` trên cả 6 bảng, sắp xếp theo `seq` tăng dần.
        - Giới hạn mặc định mỗi lần là `limit = 100` (tối đa `500` bản ghi/lần).
        - Nếu còn dữ liệu phía sau, `has_more` sẽ là `true`; Client tiếp tục gọi `/sync/pull?after_seq=<next_seq>` cho đến khi `has_more = false`.
        - **Lưu ý:** Kết quả trả về **bao gồm cả các bản ghi đã xóa mềm** (`deleted_at != null`) để Client đồng bộ trạng thái xóa.
      parameters:
      - name: after_seq
        in: query
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
        description: Số sequence lớn nhất mà Client đã đồng bộ ở lần trước (mặc định 0)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          minimum: 1
          maximum: 500
        description: Số lượng bản ghi tối đa trả về trong 1 lần pull (mặc định 100, tối đa 500)
      responses:
        '200':
          description: Danh sách thay đổi kèm thông tin phân trang sequence
          content:
            application/json:
              example:
                after_seq: 10
                next_seq: 15
                latest_seq: 15
                limit: 100
                has_more: false
                changes:
                  admin: []
                  subjects:
                  - subject_id: IT001
                    subject_name: Trí tuệ Nhân tạo
                    time_slot: Thứ 3 (09:30 - 11:30)
                    created_by: null
                    instructor_id: null
